version: '3.8'

services:
  # ── Web Server ──────────────────────────────────────────
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webserver-container
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - webnet

  # ── Jenkins (optional local Jenkins) ───────────────────
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    ports:
      - "8081:8080"    # Jenkins UI
      - "50000:50000"  # Agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Allow Jenkins to use host Docker
    restart: unless-stopped
    networks:
      - webnet

volumes:
  jenkins_home:

networks:
  webnet:
    driver: bridge
